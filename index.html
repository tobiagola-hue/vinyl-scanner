<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VinylScan">
<meta name="theme-color" content="#0d0d0d">
<title>VinylScan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--s1:#161616;--s2:#1e1e1e;--s3:#242424;
  --b1:#2a2a2a;--b2:#333;
  --amber:#e8a020;--amber2:#7a500d;--amber3:#2a1a04;
  --green:#4a9a5a;--green2:#1e3d22;--green3:#2d5e35;
  --red:#c04040;--red2:#3d1616;
  --blue:#4a7ab5;--blue2:#1a2d4a;--blue3:#243d66;
  --text:#f0ede8;--t2:#888880;--t3:#555550;--t4:#333330;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --r:10px;--r2:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:opacity .25s,transform .25s}
.screen.hidden{opacity:0;pointer-events:none;transform:translateY(16px)}

/* ── CAMERA ──────────────────────────────────── */
#cam{background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{display:none}
.vf{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
.vf-corner{position:absolute;width:20px;height:20px}
.vf-corner.tl{top:18%;left:calc(50% - 105px);border-top:2px solid var(--amber);border-left:2px solid var(--amber)}
.vf-corner.tr{top:18%;right:calc(50% - 105px);border-top:2px solid var(--amber);border-right:2px solid var(--amber)}
.vf-corner.bl{top:68%;left:calc(50% - 105px);border-bottom:2px solid var(--amber);border-left:2px solid var(--amber)}
.vf-corner.br{top:68%;right:calc(50% - 105px);border-bottom:2px solid var(--amber);border-right:2px solid var(--amber)}
.vf-hint{position:absolute;top:calc(18% - 22px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:rgba(232,160,32,.55);letter-spacing:.15em;white-space:nowrap}

.topbar{position:absolute;top:0;left:0;right:0;padding:env(safe-area-inset-top,16px) 14px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);z-index:2}
.topbar-name{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.18em}
.topbar-r{display:flex;align-items:center;gap:8px}
.pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px}
.pill.ok{background:var(--green2);color:var(--green);border:1px solid var(--green3)}
.pill.warn{background:var(--amber3);color:var(--amber);border:1px solid var(--amber2)}
.icon-btn{width:33px;height:33px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0}

.scan-wrap{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding-bottom:max(env(safe-area-inset-bottom),28px);padding-top:2.5rem;background:linear-gradient(to top,rgba(0,0,0,.88),transparent);transition:opacity .3s}
.scan-ring{width:76px;height:76px;border-radius:50%;border:2.5px solid var(--amber);background:rgba(13,13,13,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,opacity .12s}
.scan-ring:active{transform:scale(.91)}
.scan-dot{width:50px;height:50px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center}
.scan-lbl{font-family:var(--mono);font-size:9px;color:var(--t2);letter-spacing:.16em;margin-top:10px}

.scan-anim{position:absolute;left:50%;transform:translateX(-50%);width:210px;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 1.3s ease-in-out infinite;top:18%;display:none}
@keyframes sweep{0%,100%{top:18%}50%{top:68%}}
.scan-status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.2em;animation:blink 1s ease-in-out infinite;white-space:nowrap;display:none;text-align:center;line-height:2}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

.toast{position:absolute;bottom:130px;left:14px;right:14px;padding:.75rem 1rem;background:var(--red2);border:1px solid var(--red);border-radius:var(--r);font-family:var(--mono);font-size:11px;color:#e07070;transform:translateY(14px);opacity:0;transition:all .28s;pointer-events:none;z-index:5;line-height:1.5}
.toast.show{transform:translateY(0);opacity:1}

/* ── SHEET ────────────────────────────────────── */
#sheet{position:absolute;bottom:0;left:0;right:0;max-height:93vh;overflow-y:auto;background:var(--s1);border-radius:18px 18px 0 0;border-top:1px solid var(--b1);transform:translateY(100%);transition:transform .38s cubic-bezier(.16,1,.3,1);padding-bottom:env(safe-area-inset-bottom,20px);-webkit-overflow-scrolling:touch;z-index:10}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:32px;height:3px;background:var(--b1);border-radius:2px;margin:11px auto 0}
#sheet-body{padding:.9rem 1rem 1.4rem}

/* Base UI components */
.alb-artist{font-size:20px;font-weight:500;line-height:1.2;margin-bottom:2px}
.alb-title{font-size:13px;color:var(--t2);margin-bottom:.65rem;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.7rem}
.tag{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid var(--b1);color:var(--t2);background:var(--s2)}
.tag.ok{border-color:var(--green3);color:var(--green);background:var(--green2)}
.tag.warn{border-color:#5a3a1a;color:#c88030;background:#251808}
.conf-bar{height:2px;border-radius:1px;background:var(--b1);margin-bottom:.45rem;overflow:hidden}
.conf-fill{height:100%;border-radius:1px;transition:width .5s}
.conf-note{font-size:11px;font-style:italic;line-height:1.4;padding-left:.5rem;border-left:1.5px solid var(--b2);margin-bottom:.75rem}
.visible-clues{font-size:10px;color:var(--t3);margin-bottom:.65rem;line-height:1.5}
.coll-note{background:var(--s2);border-radius:var(--r);padding:.65rem .85rem;margin-bottom:.7rem;border-left:2px solid var(--amber2)}
.coll-note p{font-size:12px;color:var(--t2);line-height:1.55;font-style:italic}
.div{height:1px;background:var(--b1);margin:.75rem 0}
.sec-lbl{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.12em;margin-bottom:.5rem;display:flex;align-items:center;gap:8px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 4px var(--green)}
.no-dot{width:6px;height:6px;border-radius:50%;background:var(--b2);flex-shrink:0}

/* ── FILTER PANEL ─────────────────────────────── */
.filter-intro{font-size:12px;color:var(--t2);line-height:1.55;margin-bottom:.85rem}
.filter-row{display:flex;gap:7px;margin-bottom:.6rem;flex-wrap:wrap}
.filter-chip{font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:5px;border:1px solid var(--b1);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-chip.active{border-color:var(--amber);color:var(--amber);background:var(--amber3)}
.filter-chip:active{transform:scale(.95)}
.filter-label{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.1em;margin-bottom:.4rem}

/* Release list */
.release-list{display:flex;flex-direction:column;gap:6px;margin-bottom:.85rem;max-height:340px;overflow-y:auto}
.release-item{display:flex;align-items:center;gap:10px;padding:.6rem .75rem;background:var(--s2);border-radius:var(--r);border:1px solid var(--b1);cursor:pointer;transition:border-color .15s}
.release-item:active,.release-item.sel{border-color:var(--amber)}
.release-item.sel{background:var(--amber3)}
.rel-thumb{width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--b1)}
.rel-thumb-ph{width:36px;height:36px;border-radius:5px;background:var(--b1);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.rel-info{min-width:0;flex:1}
.rel-year{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:500}
.rel-country{font-size:11px;color:var(--t2)}
.rel-label{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel-catno{font-family:var(--mono);font-size:9px;color:var(--t4)}
.rel-fmt{font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;background:var(--b1);color:var(--t3);flex-shrink:0}
.no-results{text-align:center;color:var(--t3);font-size:12px;padding:1.5rem;font-style:italic}

.confirm-btn{width:100%;padding:14px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.1em;cursor:pointer;background:var(--amber);color:#0d0d0d;border:none;border-radius:var(--r);margin-bottom:.5rem;transition:opacity .15s}
.confirm-btn:active{opacity:.8}
.confirm-btn:disabled{opacity:.35;pointer-events:none}

/* ── PRICE PANEL ──────────────────────────────── */
.price-hero{background:var(--s2);border:1px solid var(--amber2);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:8px}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between}
.ph-label{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:.06em;margin-bottom:4px}
.ph-val{font-size:34px;font-weight:500;color:var(--amber);line-height:1;letter-spacing:-.01em}
.ph-badge{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;background:var(--amber3);color:var(--amber);border:1px solid var(--amber2);flex-shrink:0}
.ph-copies{font-family:var(--mono);font-size:10px;color:var(--t2);margin-top:7px;padding-top:7px;border-top:1px solid var(--b1);display:flex;justify-content:space-between}

.cond-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.cond-box{background:var(--s2);border-radius:8px;padding:.5rem .4rem;text-align:center}
.cond-box.hi{border:1px solid var(--amber2)}
.cond-box.hi2{border:1px solid var(--green3)}
.cond-lbl{font-family:var(--mono);font-size:7px;color:var(--t3);letter-spacing:.04em;margin-bottom:3px}
.cond-val{font-size:12px;font-weight:500}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.stat3-box{background:var(--s2);border-radius:var(--r);padding:.6rem .55rem;text-align:center}
.stat3-lbl{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:.04em;margin-bottom:3px}
.stat3-val{font-size:14px;font-weight:500}

.comm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.comm-box{background:var(--s2);border-radius:var(--r);padding:.55rem .7rem;text-align:center}
.comm-lbl{font-family:var(--mono);font-size:8px;color:var(--t3);margin-bottom:3px}
.comm-val{font-size:16px;font-weight:500}

/* Chart */
.chart-box{background:var(--s2);border-radius:var(--r);padding:.7rem .85rem;margin-bottom:8px}
.chart-note{font-family:var(--mono);font-size:8px;color:var(--t4);margin-top:.35rem;line-height:1.4}
.chart-legend{display:flex;gap:10px;margin-top:.3rem;flex-wrap:wrap}

/* Links */
.disc-link{display:flex;align-items:center;gap:10px;padding:.7rem .9rem;background:var(--s2);border-radius:var(--r);border:1px solid var(--b1);text-decoration:none;cursor:pointer;transition:border-color .18s;margin-bottom:.85rem}
.disc-link:active{border-color:var(--amber)}

.new-btn{width:100%;padding:13px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer;background:transparent;color:var(--t2);border:1px solid var(--b1);border-radius:var(--r)}
.new-btn:active{border-color:var(--amber);color:var(--amber)}

/* ── DRAWER ───────────────────────────────────── */
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;opacity:0;pointer-events:none;transition:opacity .28s;-webkit-backdrop-filter:blur(5px)}
#drawer.open{opacity:1;pointer-events:all}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(300px,86vw);background:var(--s1);padding:env(safe-area-inset-top,18px) 1.1rem 2rem;transform:translateX(100%);transition:transform .32s cubic-bezier(.16,1,.3,1);overflow-y:auto;display:flex;flex-direction:column;gap:.85rem}
#drawer.open .drawer-panel{transform:translateX(0)}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between}
.drawer-ttl{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.12em}
.x-btn{width:27px;height:27px;border-radius:50%;border:1px solid var(--b1);background:none;color:var(--t2);cursor:pointer;font-size:12px}
.d-lbl{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.12em;margin-bottom:.5rem}
input[type=password]{width:100%;padding:12px 14px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:12px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--amber)}
input::placeholder{color:var(--t4)}
.hint{font-size:10px;color:var(--t3);margin-top:.4rem;line-height:1.55}
a{color:var(--amber);text-decoration:none}
.save-btn{padding:13px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;cursor:pointer;background:var(--amber);color:#0d0d0d;border:none;border-radius:var(--r)}
.danger-btn{padding:11px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;background:transparent;color:var(--red);border:1px solid var(--red2);border-radius:var(--r)}
</style>
</head>
<body>

<!-- ══ CAMERA ══════════════════════════════════ -->
<div class="screen" id="cam">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="vf" id="vf">
    <span class="vf-hint">PUNTA LA FOTOCAMERA SUL VINILE</span>
    <div class="vf-corner tl"></div><div class="vf-corner tr"></div>
    <div class="vf-corner bl"></div><div class="vf-corner br"></div>
  </div>

  <div class="scan-anim" id="scan-anim"></div>
  <div class="scan-status" id="scan-status"></div>

  <div class="topbar">
    <span class="topbar-name">◉ VINYL SCAN</span>
    <div class="topbar-r">
      <span class="pill ok" id="api-pill">LIVE</span>
      <div class="icon-btn" onclick="openDrawer()">⚙</div>
    </div>
  </div>

  <div class="scan-wrap" id="scan-wrap">
    <div class="scan-ring" id="scan-ring" onclick="doScan()">
      <div class="scan-dot">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#0d0d0d" stroke-width="2.5"/>
          <circle cx="12" cy="12" r="3" fill="#0d0d0d"/>
        </svg>
      </div>
    </div>
    <span class="scan-lbl" id="scan-lbl">SCANSIONA</span>
  </div>

  <div class="toast" id="toast"></div>

  <div id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<!-- ══ SETTINGS DRAWER ═════════════════════════ -->
<div id="drawer" onclick="drawerBgClick(event)">
  <div class="drawer-panel">
    <div class="drawer-hdr">
      <span class="drawer-ttl">IMPOSTAZIONI</span>
      <button class="x-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div>
      <div class="d-lbl">GROQ API KEY (OVERRIDE)</div>
      <input type="password" id="s-groq" placeholder="gsk_... (lascia vuoto se in env vars)" style="margin-bottom:.3rem">
      <p class="hint"><a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a> — gratis</p>
    </div>
    <div>
      <div class="d-lbl">DISCOGS TOKEN (OVERRIDE)</div>
      <input type="password" id="s-discogs" placeholder="token... (lascia vuoto se in env vars)" style="margin-bottom:.3rem">
      <p class="hint"><a href="https://www.discogs.com/settings/developers" target="_blank">discogs.com → Developers</a> — gratis</p>
    </div>
    <div style="font-size:10px;color:var(--t3);line-height:1.5;padding:.6rem .75rem;background:var(--s2);border-radius:var(--r)">
      Le env vars Netlify <code style="color:var(--amber)">GROQ_API_KEY</code> e <code style="color:var(--amber)">DISCOGS_TOKEN</code> hanno sempre la priorità.
    </div>
    <button class="save-btn" onclick="saveDrawer()">SALVA</button>
    <button class="danger-btn" onclick="resetAll()">Cancella tutto e reimposta</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let GK = '', DT = '', busy = false;
let currentGroqData = null;   // dati Groq dell'ultima scansione
let currentVersions = [];     // tutte le versioni trovate
let filteredVersions = [];    // versioni dopo i filtri attivi
let selectedReleaseId = null; // release selezionata dall'utente
let activeFilters = { years: [], countries: [], formats: [] };

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
window.onload = () => {
  GK = ls('vs_groq');
  DT = ls('vs_discogs');
  camStart();
};

function ls(k) { return localStorage.getItem(k) || ''; }
function lsSet(k, v) { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }

/* ══════════════════════════════════════════════
   CAMERA
══════════════════════════════════════════════ */
async function camStart() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    document.getElementById('video').srcObject = s;
  } catch (e) {
    showToast('Accesso camera negato. Abilita la fotocamera nelle impostazioni del browser.');
  }
}

function capture() {
  const v = document.getElementById('video'), c = document.getElementById('canvas');
  c.width = v.videoWidth || 1280; c.height = v.videoHeight || 720;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88).split(',')[1];
}

/* ══════════════════════════════════════════════
   SCAN STATE
══════════════════════════════════════════════ */
function setScan(on, label = '') {
  busy = on;
  document.getElementById('scan-anim').style.display  = on ? 'block' : 'none';
  document.getElementById('scan-status').style.display = on ? 'block' : 'none';
  if (on) document.getElementById('scan-status').textContent = label;
  document.getElementById('vf').style.opacity        = on ? 0 : 1;
  document.getElementById('scan-wrap').style.opacity = on ? 0 : 1;
}

/* ══════════════════════════════════════════════
   MAIN SCAN
══════════════════════════════════════════════ */
async function doScan() {
  if (busy) return;
  busy = true;
  closeSheet();
  resetFilters();
  setScan(true, 'RICONOSCE IL DISCO...');

  try {
    // ── Step 1: Groq Vision ──
    const img = capture();
    const groqRes = await fetch('/.netlify/functions/groq', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_b64: img, groq_key: GK }),
    });
    if (!groqRes.ok) throw new Error('Groq function HTTP ' + groqRes.status);
    const groqData = await groqRes.json();

    if (!groqData.found || groqData.error) {
      showToast(groqData.error || 'Non riesco a identificare il disco — avvicinati e illumina meglio');
      setScan(false);
      return;
    }

    currentGroqData = groqData;

    // ── Step 2: Discogs — cerca versioni vinile ──
    setScan(true, 'CERCA VERSIONI SU DISCOGS...');
    const discRes = await fetch('/.netlify/functions/discogs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action:         'search_versions',
        query:          groqData.discogs_query,
        artist:         groqData.artist,
        album:          groqData.album,
        catalog_number: groqData.catalog_number,
        year:           groqData.year,
        discogs_token:  DT,
      }),
    });

    let versionsData = null;
    if (discRes.ok) versionsData = await discRes.json();

    setScan(false);

    if (!versionsData || versionsData.error) {
      // Mostra solo dati Groq senza selezione pressatura
      renderFilterPanel(groqData, []);
    } else {
      currentVersions = versionsData.versions || [];
      renderFilterPanel(groqData, currentVersions);
    }

  } catch (e) {
    showToast('Errore: ' + (e.message || 'Riprova'));
    setScan(false);
  }
}

/* ══════════════════════════════════════════════
   FILTER PANEL
══════════════════════════════════════════════ */
function resetFilters() {
  activeFilters = { years: [], countries: [], formats: [] };
  selectedReleaseId = null;
  currentVersions = [];
  filteredVersions = [];
}

function renderFilterPanel(groq, versions) {
  const conf = {
    high:   { c: 'var(--green)',  w: '100%', t: 'Identificazione sicura' },
    medium: { c: 'var(--amber)',  w: '65%',  t: 'Identificazione probabile — verifica' },
    low:    { c: 'var(--red)',    w: '30%',  t: 'Incerto — controlla prima di comprare' },
  }[groq.confidence] || { c: 'var(--amber)', w: '50%', t: '' };

  const pType = groq.pressing_type || 'Unknown';
  const pCls  = pType.includes('Original') ? 'ok' : pType.includes('Reissue') ? 'warn' : '';

  let html = `
    <p class="alb-artist">${esc(groq.artist)}</p>
    <p class="alb-title">${esc(groq.album)}${groq.year ? ` · <span style="color:var(--t3)">${esc(String(groq.year))}</span>` : ''}</p>
    <div class="tags">
      ${groq.format         ? `<span class="tag">${esc(groq.format)}</span>` : ''}
      ${groq.label          ? `<span class="tag">${esc(groq.label)}</span>` : ''}
      ${groq.country_press  ? `<span class="tag">${esc(groq.country_press)}</span>` : ''}
      ${groq.catalog_number ? `<span class="tag">${esc(groq.catalog_number)}</span>` : ''}
      ${pType !== 'Unknown' ? `<span class="tag ${pCls}">${esc(pType)}</span>` : ''}
      ${groq.genre          ? `<span class="tag">${esc(groq.genre)}</span>` : ''}
    </div>
    <div class="conf-bar"><div class="conf-fill" style="width:${conf.w};background:${conf.c}"></div></div>
    <p class="conf-note" style="color:${conf.c}">${conf.t}${groq.confidence_reason ? ` — ${esc(groq.confidence_reason)}` : ''}</p>`;

  if (groq.visible_clues)  html += `<p class="visible-clues">👁 ${esc(groq.visible_clues)}</p>`;
  if (groq.collector_note) html += `<div class="coll-note"><p>${esc(groq.collector_note)}</p></div>`;

  html += `<div class="div"></div>`;

  if (versions.length === 0) {
    html += `
      <p class="filter-intro">Nessuna pressatura trovata su Discogs. Verifica manualmente.</p>
      <button class="new-btn" onclick="newScan()">← NUOVO SCAN</button>`;
  } else {
    // Estrai opzioni filtro uniche
    const years     = [...new Set(versions.map(v => v.year).filter(Boolean))].sort((a,b)=>b-a);
    const countries = [...new Set(versions.map(v => v.country).filter(Boolean))].sort();
    const formats   = [...new Set(versions.map(v => normalizeFormat(v.format)).filter(Boolean))].sort();

    html += `
      <p class="filter-intro">Trovate <strong style="color:var(--text)">${versions.length} pressature vinile</strong> su Discogs. Filtra e seleziona quella giusta.</p>`;

    if (years.length > 1) {
      html += `<div class="filter-label">ANNO</div><div class="filter-row" id="f-years">`;
      years.slice(0, 12).forEach(y => {
        html += `<div class="filter-chip" data-type="years" data-val="${y}" onclick="toggleFilter(this)">${y}</div>`;
      });
      html += `</div>`;
    }

    if (countries.length > 1) {
      html += `<div class="filter-label">PAESE DI STAMPA</div><div class="filter-row" id="f-countries">`;
      countries.slice(0, 12).forEach(c => {
        html += `<div class="filter-chip" data-type="countries" data-val="${esc(c)}" onclick="toggleFilter(this)">${esc(c)}</div>`;
      });
      html += `</div>`;
    }

    if (formats.length > 1) {
      html += `<div class="filter-label">FORMATO</div><div class="filter-row" id="f-formats">`;
      formats.slice(0, 8).forEach(f => {
        html += `<div class="filter-chip" data-type="formats" data-val="${esc(f)}" onclick="toggleFilter(this)">${esc(f)}</div>`;
      });
      html += `</div>`;
    }

    html += `<div class="div"></div>`;
    html += `<div class="sec-lbl"><span class="live-dot"></span>SELEZIONA LA PRESSATURA</div>`;
    html += `<div class="release-list" id="release-list"></div>`;
    html += `<button class="confirm-btn" id="confirm-btn" disabled onclick="confirmRelease()">VEDI PREZZI →</button>`;
    html += `<button class="new-btn" onclick="newScan()">← NUOVO SCAN</button>`;
  }

  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('sheet').classList.add('open');

  if (versions.length > 0) {
    filteredVersions = [...versions];
    renderReleaseList();
  }
}

function normalizeFormat(fmt) {
  if (!fmt) return null;
  const f = fmt.toLowerCase();
  if (f.includes('7'))  return '7"';
  if (f.includes('10')) return '10"';
  if (f.includes('12') || f.includes('lp') || f.includes('album')) return 'LP / 12"';
  if (f.includes('2x') || f.includes('double')) return '2xLP';
  if (f.includes('vinyl')) return 'LP / 12"';
  return fmt.split(',')[0].trim().slice(0, 12);
}

function toggleFilter(el) {
  const type = el.dataset.type;
  const val  = el.dataset.val;
  el.classList.toggle('active');
  const arr = activeFilters[type];
  const idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  applyFilters();
}

function applyFilters() {
  filteredVersions = currentVersions.filter(v => {
    if (activeFilters.years.length > 0 && !activeFilters.years.includes(String(v.year))) return false;
    if (activeFilters.countries.length > 0 && !activeFilters.countries.includes(v.country)) return false;
    if (activeFilters.formats.length > 0 && !activeFilters.formats.includes(normalizeFormat(v.format))) return false;
    return true;
  });
  selectedReleaseId = null;
  document.getElementById('confirm-btn').disabled = true;
  renderReleaseList();
}

function renderReleaseList() {
  const container = document.getElementById('release-list');
  if (!container) return;

  if (filteredVersions.length === 0) {
    container.innerHTML = `<div class="no-results">Nessun risultato per i filtri selezionati.<br>Rimuovi alcuni filtri.</div>`;
    return;
  }

  container.innerHTML = filteredVersions.map((v, i) => {
    const thumb = v.thumb
      ? `<img class="rel-thumb" src="${esc(v.thumb)}" onerror="this.style.display='none'" loading="lazy">`
      : `<div class="rel-thumb-ph">🎵</div>`;
    return `<div class="release-item" id="rel-${v.id}" onclick="selectRelease(${v.id}, ${i})">
      ${thumb}
      <div class="rel-info">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <span class="rel-year">${v.year || '?'}</span>
          <span class="rel-country">${esc(v.country || '—')}</span>
        </div>
        <div class="rel-label">${esc(v.label || '—')}</div>
        <div class="rel-catno">${esc(v.catno || '')}</div>
      </div>
      <span class="rel-fmt">${esc(normalizeFormat(v.format) || 'LP')}</span>
    </div>`;
  }).join('');
}

function selectRelease(id, idx) {
  // Deseleziona tutto
  document.querySelectorAll('.release-item').forEach(el => el.classList.remove('sel'));
  const el = document.getElementById('rel-' + id);
  if (el) el.classList.add('sel');
  selectedReleaseId = id;
  document.getElementById('confirm-btn').disabled = false;
}

/* ══════════════════════════════════════════════
   CONFIRM → FETCH PREZZI
══════════════════════════════════════════════ */
async function confirmRelease() {
  if (!selectedReleaseId) return;

  const btn = document.getElementById('confirm-btn');
  btn.textContent = 'CARICAMENTO...';
  btn.disabled = true;

  try {
    const discRes = await fetch('/.netlify/functions/discogs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action:        'get_release_data',
        release_id:    selectedReleaseId,
        discogs_token: DT,
      }),
    });

    if (!discRes.ok) throw new Error('HTTP ' + discRes.status);
    const priceData = await discRes.json();

    if (priceData.error) throw new Error(priceData.error);

    // Trova la versione selezionata per i metadati
    const selVersion = filteredVersions.find(v => v.id === selectedReleaseId) || {};
    renderPricePanel(currentGroqData, priceData, selVersion);

  } catch (e) {
    showToast('Errore prezzi: ' + e.message);
    btn.textContent = 'VEDI PREZZI →';
    btn.disabled = false;
  }
}

/* ══════════════════════════════════════════════
   PRICE PANEL
══════════════════════════════════════════════ */
function renderPricePanel(groq, d, ver) {
  const cur = d.listings_currency || d.median_currency || '€';
  const Sf  = (v) => v != null ? `${cur} ${Number(v) % 1 === 0 ? Number(v).toFixed(0) : Number(v).toFixed(1)}` : '—';
  const discUrl = `https://www.discogs.com/release/${d.release_id}`;

  let html = `
    <p class="alb-artist">${esc(groq.artist)}</p>
    <p class="alb-title">${esc(groq.album)}</p>
    <div class="tags">
      ${ver.year    ? `<span class="tag hi" style="border-color:var(--amber2);color:var(--amber);background:var(--amber3)">${ver.year}</span>` : ''}
      ${ver.country ? `<span class="tag">${esc(ver.country)}</span>` : ''}
      ${ver.label   ? `<span class="tag">${esc(ver.label)}</span>` : ''}
      ${ver.catno   ? `<span class="tag">${esc(ver.catno)}</span>` : ''}
      ${normalizeFormat(ver.format) ? `<span class="tag">${esc(normalizeFormat(ver.format))}</span>` : ''}
    </div>
    <div class="div"></div>`;

  // ── Community stats: HANNO / VOGLIONO / IN VENDITA ──
  if (d.community_want != null || d.community_have != null || d.num_for_sale != null) {
    html += `<div class="sec-lbl"><span class="live-dot"></span>COMUNITÀ DISCOGS</div>
    <div class="comm-grid">
      ${d.community_want != null ? `<div class="comm-box"><div class="comm-lbl">VOGLIONO</div><div class="comm-val" style="color:var(--amber)">${Number(d.community_want).toLocaleString('it')}</div></div>` : ''}
      ${d.community_have != null ? `<div class="comm-box"><div class="comm-lbl">HANNO</div><div class="comm-val">${Number(d.community_have).toLocaleString('it')}</div></div>` : ''}
      ${d.num_for_sale   != null ? `<div class="comm-box"><div class="comm-lbl">IN VENDITA</div><div class="comm-val" style="color:var(--green)">${Number(d.num_for_sale).toLocaleString('it')}</div></div>` : ''}
    </div>`;
  }

  // ── Hero: media prezzi annunci attivi VG+ ──
  const heroVal = d.listings_avg ?? d.listings_median ?? d.median_vgp;
  const numLive = d.listings_count || 0;

  html += `<div class="sec-lbl" style="margin-top:.2rem"><span class="live-dot"></span>PREZZI LIVE — ANNUNCI ATTIVI VG / VG+ / NM / M</div>`;

  if (heroVal != null) {
    html += `<div class="price-hero">
      <div class="ph-top">
        <div>
          <div class="ph-label">MEDIA PREZZI ANNUNCI ATTIVI VG+</div>
          <div class="ph-val">${Sf(heroVal)}</div>
        </div>
        <div class="ph-badge">LIVE</div>
      </div>
      <div class="ph-copies">
        <span>📦 ${numLive} ann${numLive === 1 ? 'uncio' : 'unci'} attivi (VG e superiori)</span>
        ${d.listings_median != null ? `<span style="color:var(--t3)">med ${Sf(d.listings_median)}</span>` : ''}
      </div>
    </div>`;
  } else if (numLive > 0) {
    html += `<div class="price-hero">
      <div class="ph-top">
        <div>
          <div class="ph-label">ANNUNCI ATTIVI</div>
          <div class="ph-val" style="font-size:26px">${numLive}</div>
        </div>
        <div class="ph-badge">LIVE</div>
      </div>
    </div>`;
  }

  // ── Min / Media / Max annunci attivi ──
  if (d.listings_count > 0) {
    html += `<div class="stat3">
      <div class="stat3-box">
        <div class="stat3-lbl">PREZZO PIÙ BASSO</div>
        <div class="stat3-val" style="color:var(--green)">${Sf(d.listings_min)}</div>
      </div>
      <div class="stat3-box" style="border:1px solid var(--b2)">
        <div class="stat3-lbl">MEDIA</div>
        <div class="stat3-val" style="color:var(--amber)">${Sf(d.listings_avg)}</div>
      </div>
      <div class="stat3-box">
        <div class="stat3-lbl">PREZZO PIÙ ALTO</div>
        <div class="stat3-val" style="color:var(--t2)">${Sf(d.listings_max)}</div>
      </div>
    </div>`;
  }

  // ── Mediane ufficiali Discogs per condizione ──
  if (d.median_vg || d.median_vgp || d.median_nm || d.median_m) {
    html += `<div style="font-family:var(--mono);font-size:8px;color:var(--t3);margin-bottom:5px;letter-spacing:.06em">PREZZO MEDIANO PER CONDIZIONE (DA VENDITE REALI DISCOGS)</div>
    <div class="cond-row">
      <div class="cond-box">
        <div class="cond-lbl">VG</div>
        <div class="cond-val" style="color:var(--t2)">${Sf(d.median_vg)}</div>
      </div>
      <div class="cond-box hi">
        <div class="cond-lbl">VG+</div>
        <div class="cond-val" style="color:var(--amber)">${Sf(d.median_vgp)}</div>
      </div>
      <div class="cond-box hi2">
        <div class="cond-lbl">NM</div>
        <div class="cond-val" style="color:var(--green)">${Sf(d.median_nm)}</div>
      </div>
      <div class="cond-box">
        <div class="cond-lbl">M</div>
        <div class="cond-val" style="color:var(--green)">${Sf(d.median_m)}</div>
      </div>
    </div>`;
  }

  // ── Grafico ultimi 15 annunci attivi ──
  if (d.last_listings && d.last_listings.length >= 3) {
    html += buildChart(d.last_listings, cur);
  }

  // ── Link Discogs ──
  html += `<a href="${discUrl}" class="disc-link" target="_blank">
    <span style="font-size:16px">💿</span>
    <div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--t2)">DISCOGS</div>
      <div style="font-size:11px;color:var(--amber)">Apri release completa →</div>
    </div>
  </a>`;

  // ── Bottone torna a filtri ──
  html += `<button class="new-btn" style="margin-bottom:.5rem" onclick="backToFilters()">← CAMBIA PRESSATURA</button>`;
  html += `<button class="new-btn" onclick="newScan()">✕ NUOVO SCAN</button>`;

  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('sheet').scrollTop = 0;
}

/* ══════════════════════════════════════════════
   CHART — ultimi 15 annunci attivi VG+
══════════════════════════════════════════════ */
function buildChart(items, currency) {
  if (!items || items.length < 2) return '';
  const cur    = currency || '€';
  const prices = items.map(d => d.price);
  const minP   = Math.min.apply(null, prices);
  const maxP   = Math.max.apply(null, prices);
  const pRange = maxP - minP || 1;

  // Dimensioni — verticale, comodo su mobile
  const W = 300, H = items.length * 28 + 24;
  const ML = 36, MR = 52, MT = 12, MB = 12;
  const iW = W - ML - MR;
  const rowH = (H - MT - MB) / Math.max(items.length - 1, 1);

  const condColor = c => {
    if (c === 'Mint (M)')             return '#4a9a5a';
    if (c === 'Near Mint (NM or M-)') return '#5aaa6a';
    if (c === 'Very Good Plus (VG+)') return '#e8a020';
    return '#777770';
  };

  const fmtP = v => `${cur}${v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)}`;
  const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const fmtD = s => { const d = new Date(s); return `${d.getDate()} ${MESI[d.getMonth()]}`; };

  // Punti: Y = posizione temporale (top=più vecchio, bottom=più recente)
  //        X = prezzo (left=min, right=max)
  const pts = items.map((d, i) => ({
    x: ML + ((d.price - minP) / pRange) * iW,
    y: MT + i * rowH,
    price: d.price,
    cond:  d.condition,
    date:  d.date,
  }));

  // Linea serpentina
  const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // Mediana verticale
  const sorted = [...prices].sort((a,b)=>a-b);
  const mid = Math.floor(sorted.length/2);
  const med = sorted.length%2 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
  const medX = ML + ((med - minP) / pRange) * iW;

  // Dots + etichette data a destra, prezzo a sinistra
  const dots = pts.map(p => {
    const col = condColor(p.cond);
    return `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${col}" stroke="#161616" stroke-width="1.2"/>
      <text x="${W-MR+6}" y="${(p.y+3.5).toFixed(1)}" font-family="IBM Plex Mono,monospace" font-size="7.5" fill="#555550">${fmtD(p.date)}</text>`;
  }).join('');

  // Linea grigia guida orizzontale su ogni punto
  const guides = pts.map(p =>
    `<line x1="${ML}" y1="${p.y.toFixed(1)}" x2="${W-MR}" y2="${p.y.toFixed(1)}" stroke="#1e1e1e" stroke-width="0.5"/>`
  ).join('');

  return `<div class="chart-box">
    <div class="sec-lbl" style="margin-bottom:.5rem"><span class="live-dot"></span>ULTIMI ${items.length} ANNUNCI ATTIVI — PREZZO NEL TEMPO</div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
      <!-- Asse X: prezzi -->
      <text x="${ML}" y="${MT-3}" font-family="IBM Plex Mono,monospace" font-size="7" fill="#444440" text-anchor="middle">${fmtP(minP)}</text>
      <text x="${W-MR}" y="${MT-3}" font-family="IBM Plex Mono,monospace" font-size="7" fill="#444440" text-anchor="middle">${fmtP(maxP)}</text>
      <!-- Linea mediana verticale -->
      <line x1="${medX.toFixed(1)}" y1="${MT}" x2="${medX.toFixed(1)}" y2="${H-MB}" stroke="rgba(232,160,32,0.25)" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="${medX.toFixed(1)}" y="${MT-3}" font-family="IBM Plex Mono,monospace" font-size="7" fill="rgba(232,160,32,.6)" text-anchor="middle">med</text>
      <!-- Guide orizzontali -->
      ${guides}
      <!-- Serpentina -->
      <polyline points="${poly}" fill="none" stroke="rgba(232,160,32,0.2)" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Dots + date -->
      ${dots}
      <!-- Bordo sinistro asse Y -->
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H-MB}" stroke="#2a2a2a" stroke-width="0.5"/>
    </svg>
    <div class="chart-legend" style="margin-top:.4rem">
      <span style="font-family:var(--mono);font-size:8px;color:#5aaa6a">● M/NM</span>
      <span style="font-family:var(--mono);font-size:8px;color:var(--amber)">● VG+</span>
      <span style="font-family:var(--mono);font-size:8px;color:#777770">● VG</span>
      <span style="font-family:var(--mono);font-size:8px;color:var(--t4)">← min · max →</span>
    </div>
    <div class="chart-note">Annunci attivi su Discogs. Dal più vecchio (alto) al più recente (basso). I prezzi vendite concluse non sono accessibili via API Discogs.</div>
  </div>`;
}
/* ══════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════ */
function backToFilters() {
  renderFilterPanel(currentGroqData, currentVersions);
}

function closeSheet()  { document.getElementById('sheet').classList.remove('open'); }
function newScan()     { closeSheet(); setTimeout(() => { document.getElementById('sheet-body').innerHTML = ''; }, 380); resetFilters(); }

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 6000);
}

/* ══════════════════════════════════════════════
   ESCAPE
══════════════════════════════════════════════ */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════
   DRAWER
══════════════════════════════════════════════ */
function openDrawer() {
  document.getElementById('s-groq').value    = ls('vs_groq');
  document.getElementById('s-discogs').value = ls('vs_discogs');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer()          { document.getElementById('drawer').classList.remove('open'); }
function drawerBgClick(e)       { if (e.target === document.getElementById('drawer')) closeDrawer(); }
function saveDrawer() {
  GK = document.getElementById('s-groq').value.trim();
  DT = document.getElementById('s-discogs').value.trim();
  lsSet('vs_groq', GK); lsSet('vs_discogs', DT);
  closeDrawer();
}
function resetAll() {
  if (!confirm('Cancellare tutte le impostazioni?')) return;
  localStorage.clear(); location.reload();
}
